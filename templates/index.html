<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="controls">
        <div id="workspaceManager">
            <select id="workspaceSelect">
                <option value="">Load Workspace...</option>
            </select>
            <button id="newWorkspaceBtn">New Workspace</button>
        </div>
        <div id="workspaceName">
            <span id="nameDisplay">Untitled Workspace</span>
        </div>
        <button id="addNodeBtn">Create Node</button>
        <span id="zoomLevel">Zoom: 100%</span>
    </div>
    <div id="viewport">
        <div id="workspace"></div>
    </div>
    <script src="{{ url_for('static', filename='workspace.js') }}"></script>
    <script src="{{ url_for('static', filename='node.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
